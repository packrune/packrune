# Packrune — golangci-lint config (v2 format).
#
# Philosophy: catch real bugs, enforce the house style, don't fight the
# compiler. Lints that produce more noise than signal are off.
version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # stdlib vet
    - ineffassign    # ineffective assignments
    - staticcheck    # the big one — many real bugs
    - unused         # dead code
    - bodyclose      # http.Response.Body leaks
    - contextcheck   # ctx propagation
    - errorlint      # %w usage, errors.Is/As
    - misspell       # typos in comments
    - nakedret       # avoid naked returns in long funcs
    - nilerr         # returning nil after err check
    - prealloc       # slice prealloc where obvious
    - revive         # style (replaces golint)
    - unconvert      # redundant type conversions
    - whitespace     # leading/trailing whitespace
    - copyloopvar    # Go 1.22+ loop var fix

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    misspell:
      locale: US

  exclusions:
    rules:
      # Test files: relax a few rules where they add noise without value.
      - path: _test\.go
        linters:
          - errcheck
          - prealloc
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/packrune/packrune

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
